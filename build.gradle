plugins {
    id 'babric-loom' version '1.5-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

// Configuration for including dependencies in the JAR
configurations {
    include
}

loom {
    gluedMinecraftJar()
    customMinecraftManifest.set("https://babric.github.io/manifest-polyfill/${minecraft_version}.json")
    intermediaryUrl.set("https://maven.glass-launcher.net/babric/babric/intermediary/%1\$s/intermediary-%1\$s-v2.jar")
}

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
    maven {
        name = 'Babric'
        url = 'https://maven.glass-launcher.net/babric'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "babric:barn:${project.yarn_mappings}:v2"
    modImplementation "babric:fabric-loader:${project.loader_version}"

    // Discord dependencies - also include them in the JAR
    implementation "net.dv8tion:JDA:5.0.0-beta.13"
    include "net.dv8tion:JDA:5.0.0-beta.13"
    implementation "club.minnced:discord-webhooks:0.8.4"
    include "club.minnced:discord-webhooks:0.8.4"
    implementation "com.google.code.gson:gson:2.8.9"
    include "com.google.code.gson:gson:2.8.9"

    // Logging and utilities
    implementation "org.slf4j:slf4j-api:1.8.0-beta4"
    include "org.slf4j:slf4j-api:1.8.0-beta4"
    implementation "org.apache.logging.log4j:log4j-slf4j18-impl:2.16.0"
    include "org.apache.logging.log4j:log4j-slf4j18-impl:2.16.0"
    implementation 'com.google.guava:guava:30.0-jre'
    include 'com.google.guava:guava:30.0-jre'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
    // Include all dependencies marked with 'include'
    from(configurations.include.collect { it.isDirectory() ? it : zipTree(it) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here if needed
    }
}